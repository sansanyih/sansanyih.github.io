<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>申思宇 · 前端开发工程师</title>
    <meta
      name="description"
      content="申思宇，前端开发工程师（2026 届）。Vue3 全栈 / uni-app 跨端 / 前端工程化。精选项目：TinyShop 跨端商城重构、AI PPT 生成器、CnAcg 动漫社区。"
    />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#work">跳到作品</a>

    <header class="nav" id="nav">
      <div class="nav__inner">
        <a class="nav__brand" href="#top">
          <span class="nav__mark">✳</span>
          <span>申思宇</span>
          <span class="nav__brand-sub">SHEN SIYU</span>
        </a>
        <nav class="nav__links" aria-label="页面导航">
          <a href="#work" data-nav="work"><i>01</i>作品</a>
          <a href="#approach" data-nav="approach"><i>02</i>方法</a>
          <a href="#journey" data-nav="journey"><i>03</i>经历</a>
          <a href="#contact" data-nav="contact"><i>04</i>联系</a>
        </nav>
      </div>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__grid">
          <div class="hero__text">
            <p class="eyebrow" id="hero-eyebrow"></p>
            <h1 class="hero__name" id="hero-title"></h1>
            <p class="hero__role" id="hero-role"></p>
            <p class="hero__tagline" id="hero-tagline"></p>
            <ul class="hero__stack" id="hero-stack" aria-label="技术栈"></ul>
            <div class="hero__actions" id="hero-actions"></div>
          </div>

          <div class="hero__aside" aria-hidden="true">
            <div class="orb">
              <div class="orb__ring"></div>
              <div class="orb__ring orb__ring--2"></div>
              <div class="orb__core"></div>
              <div class="orb__scanline"></div>
            </div>
            <p class="hero__aside-label">CANVAS · CSS ONLY</p>
          </div>
        </div>

        <ul class="metrics" id="hero-metrics" aria-label="关键数据"></ul>

        <p class="hero__scroll"><span>↓</span> 精选作品在下面</p>
      </section>

      <section class="section" id="work" aria-labelledby="work-title">
        <div class="section__head">
          <p class="section__index">01 / SELECTED WORK</p>
          <h2 class="section__title" id="work-title">精选作品</h2>
          <p class="section__note" id="work-note"></p>
        </div>
        <div class="work" id="work-list"></div>
      </section>

      <section class="section" id="approach" aria-labelledby="approach-title">
        <div class="section__head">
          <p class="section__index">02 / APPROACH</p>
          <h2 class="section__title" id="approach-title">我怎么做事</h2>
        </div>
        <div class="approach" id="approach-list"></div>
      </section>

      <section class="section" id="journey" aria-labelledby="journey-title">
        <div class="section__head">
          <p class="section__index">03 / JOURNEY</p>
          <h2 class="section__title" id="journey-title">经历</h2>
        </div>
        <ol class="journey" id="journey-list"></ol>
        <ul class="honors" id="honors-list"></ul>
      </section>

      <section class="section section--contact" id="contact" aria-labelledby="contact-title">
        <p class="section__index">04 / CONTACT</p>
        <h2 class="contact__title" id="contact-title">聊聊一个小项目？</h2>
        <div class="contact__row">
          <a class="contact__email" id="contact-email" href="#"></a>
          <button class="contact__copy" id="copy-email" type="button">复制邮箱</button>
        </div>
        <ul class="contact__links" id="contact-links"></ul>
      </section>
    </main>

    <footer class="footer">
      <span id="footer-name">申思宇</span>
      <span class="footer__meta">纯 HTML / CSS / 原生 JS · 无构建步骤 · 内容在 <code>content.js</code></span>
      <span id="footer-year"></span>
    </footer>

    <script src="content.js"></script>
    <script src="main.js"></script>
  </body>
</html>
