name: deploy-site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vitepress/package-lock.json

      - name: Install blog deps
        working-directory: vitepress
        run: npm install --no-audit --no-fund

      - name: Build blog
        working-directory: vitepress
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/blog
          cp index.html styles.css content.js main.js _site/
          cp -R assets _site/assets
          cp .nojekyll _site/
          cp -R vitepress/.vitepress/dist/. _site/blog/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
